<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sasika Randunuge — Web developer, UI/UX and graphic designer based in Kandy, Sri Lanka."
    />
    <meta name="theme-color" content="#08080A" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#FAF9F5");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- warm up the image CDN connections before the first request (LCP) -->
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <!-- project imagery lives on imgbb — warm that connection too -->
    <link rel="preconnect" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <!-- hero is the largest paint on the home page — fetch it immediately -->
    <link
      rel="preload"
      as="image"
      href="https://images.pexels.com/photos/30767251/pexels-photo-30767251.jpeg?auto=compress&cs=tinysrgb&w=1920"
      fetchpriority="high"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Sasika Randunuge — Web Developer & UI/UX Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
